<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password | Sales Research Pro</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at top right,rgba(92,73,230,.45),transparent 35%),linear-gradient(145deg,#081b3a,#2839a8);color:#172033}.card{width:min(560px,100%);background:#fff;border-radius:24px;padding:42px 34px;box-shadow:0 28px 80px rgba(0,0,0,.24)}.brand{text-align:center;font-size:20px;font-weight:850;color:#102a56;margin-bottom:28px}h1{text-align:center;margin:0;font-size:30px}.sub{text-align:center;color:#667085;line-height:1.55;margin:12px 0 26px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:6px;color:#344054}.field input{width:100%;padding:13px 14px;border:1px solid #d0d5dd;border-radius:11px;font-size:15px;outline:none}.field input:focus{border-color:#84adff;box-shadow:0 0 0 3px #eff4ff}button{width:100%;margin-top:10px;border:0;border-radius:11px;padding:13px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;font-size:14px;font-weight:850;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.msg{margin-top:16px;padding:12px;border-radius:10px;font-size:13px;line-height:1.5;background:#f8fafc;color:#475467}.msg.ok{background:#ecfdf3;color:#067647}.msg.err{background:#fef3f2;color:#b42318}.sandbox{text-align:center;margin-top:22px;color:#9a5b00;font-size:11px;font-weight:800}.hidden{display:none}
</style>
</head>
<body><main class="card"><div class="brand">Sales Research Pro</div><h1>Reset your password</h1><p class="sub">Choose a new password for your account.</p><div id="form"><div class="field"><label for="pw">New password</label><input id="pw" type="password" minlength="6" autocomplete="new-password"></div><div class="field"><label for="pw2">Confirm new password</label><input id="pw2" type="password" minlength="6" autocomplete="new-password"></div><button id="save">UPDATE PASSWORD</button></div><div id="msg" class="msg">Checking your recovery link…</div><div class="sandbox">SANDBOX · TEST MODE</div></main>
<script>
const SUPABASE_URL='https://cornnadejzvqkidrriqb.supabase.co';
const SUPABASE_KEY='sb_publishable_9h7qxQUlXS8oDhoiFjzu8A_pLZgb-1v';
const msg=document.getElementById('msg'), form=document.getElementById('form'), save=document.getElementById('save');
function show(t,kind=''){msg.textContent=t;msg.className='msg'+(kind?' '+kind:'');}
const hash=new URLSearchParams(location.hash.slice(1));
const accessToken=hash.get('access_token');
const type=hash.get('type');
if(!accessToken || (type && type!=='recovery')){form.classList.add('hidden');show('This password reset link is invalid or has expired. Request a new reset email from the extension.','err');}else{show('Recovery link verified. Enter your new password below.');}
save.onclick=async()=>{const a=document.getElementById('pw').value,b=document.getElementById('pw2').value;if(a.length<6){show('Password must be at least 6 characters.','err');return}if(a!==b){show('Passwords do not match.','err');return}save.disabled=true;save.textContent='UPDATING…';try{const r=await fetch(SUPABASE_URL+'/auth/v1/user',{method:'PUT',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({password:a})});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.msg||d?.message||d?.error_description||'Unable to update password.');form.classList.add('hidden');show('Password updated successfully. You can close this page and return to the Chrome extension to sign in.','ok');history.replaceState(null,'',location.pathname);}catch(e){show(e.message||'Unable to update password.','err');save.disabled=false;save.textContent='UPDATE PASSWORD';}};
</script></body></html>
