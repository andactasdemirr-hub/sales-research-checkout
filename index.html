<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Sales Research Pro Checkout</title>

  <!-- Paddle.js -->
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;

      background: #f5f7fb;
      color: #172033;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e4e7ec;
      border-radius: 18px;
      padding: 40px 32px;
      text-align: center;

      box-shadow:
        0 20px 50px rgba(15, 23, 42, 0.08);
    }

    .logo {
      width: 54px;
      height: 54px;

      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      background: #1677ff;
      color: white;

      font-size: 26px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 8px;
      color: #667085;
      font-size: 15px;
    }

    .production {
      display: inline-block;

      margin-top: 20px;

      padding: 7px 12px;

      border-radius: 999px;

      background: #ecfdf3;
      color: #067647;

      font-size: 12px;
      font-weight: 700;
    }

    #status {
      margin-top: 26px;

      padding: 15px;

      border-radius: 10px;

      background: #f8fafc;

      font-size: 14px;
      line-height: 1.5;

      color: #475467;
    }

    #status.error {
      background: #fef3f2;
      color: #b42318;
    }

    #status.success {
      background: #ecfdf3;
      color: #067647;
    }

    .security {
      margin-top: 24px;

      font-size: 12px;
      color: #98a2b3;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">SR</div>

      <h1>Sales Research Pro</h1>

      <div class="subtitle">
        Secure subscription checkout
      </div>

      <div class="production">
        SECURE PAYMENT
      </div>

      <div id="status">
        Preparing secure checkout...
      </div>

      <div class="security">
        Payments are securely processed by Paddle.
      </div>

    </div>

  </div>

  <script>
    (async function () {

      const status =
        document.getElementById("status");

      function showError(message) {
        status.className = "error";
        status.textContent = message;
      }

      function showSuccess(message) {
        status.className = "success";
        status.textContent = message;
      }

      try {

        /*
         * -------------------------------------------------------
         * 1. Initialize Paddle LIVE
         * -------------------------------------------------------
         *
         * Production is Paddle.js default environment.
         * DO NOT call Paddle.Environment.set("sandbox") here.
         *
         * This is a CLIENT-SIDE Paddle token.
         * It is safe to use in frontend code.
         *
         * Never put PADDLE_API_KEY or webhook secret here.
         */

        Paddle.Initialize({

          token: "live_8c5025fea9a82b27646ea5afe92",

          eventCallback: function(event) {

            console.log("Paddle event:", event);

            if (
              event &&
              event.name === "checkout.completed"
            ) {

              showSuccess(
                "Payment completed successfully. " +
                "You can return to Sales Research Pro and press Refresh."
              );

            }

            if (
              event &&
              event.name === "checkout.closed"
            ) {

              status.className = "";

              status.textContent =
                "Checkout closed. You can return to the extension or try again.";

            }

          }

        });


        /*
         * -------------------------------------------------------
         * 2. Read Paddle transaction ID
         * -------------------------------------------------------
         *
         * Paddle opens the payment link like:
         *
         * https://.../sales-research-checkout/?_ptxn=txn_xxxxx
         */

        const params =
          new URLSearchParams(
            window.location.search
          );

        const transactionId =
          params.get("_ptxn");


        /*
         * If this page was opened directly,
         * do not attempt to open Paddle checkout.
         */

        if (!transactionId) {

          status.textContent =
            "Checkout page is ready. " +
            "Please start a purchase from the Sales Research Pro extension.";

          return;

        }


        /*
         * Basic transaction ID validation.
         */

        if (
          !transactionId.startsWith("txn_")
        ) {

          throw new Error(
            "Invalid Paddle transaction ID."
          );

        }


        /*
         * -------------------------------------------------------
         * 3. Open Paddle Checkout
         * -------------------------------------------------------
         */

        status.textContent =
          "Opening Paddle secure checkout...";


        Paddle.Checkout.open({

          transactionId: transactionId,

          settings: {

            displayMode: "overlay",

            theme: "light",

            locale: "en",

            allowLogout: false

          }

        });


        status.textContent =
          "Complete your payment in the Paddle checkout window.";


      } catch (error) {

        console.error(
          "Sales Research Pro checkout error:",
          error
        );

        showError(
          error && error.message
            ? error.message
            : "Unable to open Paddle checkout."
        );

      }

    })();
  </script>

</body>
</html>
