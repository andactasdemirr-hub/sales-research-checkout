<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Email Verified | Sales Research Pro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;

      font-family: Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Arial, sans-serif;

      background:
        radial-gradient(circle at top right, rgba(92, 73, 230, 0.45), transparent 35%),
        linear-gradient(145deg, #081b3a, #2839a8);

      color: #172033;
    }

    .card {
      width: min(620px, 100%);
      background: #ffffff;
      border-radius: 24px;
      padding: 46px 34px;
      text-align: center;

      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.24);
    }

    .brand {
      color: #102a56;
      font-size: 20px;
      font-weight: 850;
      margin-bottom: 30px;
    }

    .check {
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background: #ecfdf3;
      color: #067647;

      font-size: 40px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: -0.5px;
    }

    p {
      max-width: 460px;
      margin: 15px auto 0;

      color: #667085;
      font-size: 16px;
      line-height: 1.65;
    }

    .note {
      margin-top: 28px;
      padding: 16px 18px;

      border-radius: 13px;

      background: #f5f7ff;
      color: #344054;

      font-size: 14px;
      font-weight: 600;
    }

    .sandbox {
      display: inline-block;

      margin-top: 24px;
      padding: 7px 12px;

      border-radius: 999px;

      background: #fff4df;
      color: #9a5b00;

      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="brand">
      Sales Research Pro
    </div>

    <div class="check">
      ✓
    </div>

    <h1>
      Email verified
    </h1>

    <p>
      Your Sales Research Pro account is ready.
      You can now return to the Chrome extension and sign in.
    </p>

    <div class="note">
      You can safely close this page.
    </div>

    <div class="sandbox">
      SANDBOX · TEST MODE
    </div>

  </main>

</body>
</html>
